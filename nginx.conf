server {
    listen 80;
    server_name 194.156.119.68;

    access_log /var/log/nginx/memory_app_access.log;
    error_log /var/log/nginx/memory_app_error.log;

    # Лимит одновременных соединений с одного IP (защита от slowloris/conn-flood)
    limit_conn conn_per_ip 30;

    # Таймауты для отбрасывания "медленных" клиентов
    client_body_timeout 15s;
    client_header_timeout 15s;
    send_timeout 30s;

    # ─── Админ-панель: пароль + жёсткий rate-limit (анти-брутфорс) ──────
    location /admin {
        auth_basic "Admin area";
        auth_basic_user_file /etc/nginx/htpasswd_admin;

        # 5 запросов/сек, кратковременные всплески до 10 (burst), без задержки
        limit_req zone=sensitive burst=10 nodelay;

        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ─── /api/results: GET/DELETE требуют пароль, POST публичный ────────
    location = /api/results {
        limit_except POST {
            auth_basic "Admin area";
            auth_basic_user_file /etc/nginx/htpasswd_admin;
        }
        # Жёсткий лимит на все методы этого пути
        limit_req zone=sensitive burst=10 nodelay;

        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ─── Публичная часть: тренажёр, картинки, открытые API ──────────────
    location / {
        # Общий лимит: 30 r/s, всплески до 60 (с задержкой — клиент подождёт,
        # а не получит 429)
        limit_req zone=general burst=60 delay=30;

        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $server_name;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        proxy_cache_valid 200 30d;
        proxy_cache_valid 404 1m;
    }
}
