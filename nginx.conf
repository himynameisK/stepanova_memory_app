server {
    listen 80;
    server_name 194.156.119.68;

    # Логи
    access_log /var/log/nginx/memory_app_access.log;
    error_log /var/log/nginx/memory_app_error.log;

    # Проксирование всех запросов на Gunicorn (включая статические файлы)
    # Flask/Gunicorn может читать файлы из /root, поэтому это безопасно
    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $server_name;
        
        # Таймауты для длительных запросов
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        
        # Кэширование статических файлов на стороне прокси
        proxy_cache_valid 200 30d;
        proxy_cache_valid 404 1m;
    }
}
