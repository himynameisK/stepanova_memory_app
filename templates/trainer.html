<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Тренажёр памяти</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <header>
            <h1>Тренажёр памяти</h1>
            <nav>
                <a href="/reference" class="btn btn-secondary">Справочник</a>
                <a href="/admin" class="btn btn-secondary">Админ-панель</a>
            </nav>
            <div id="progress-bar-wrap" class="progress-info hidden">
                <span id="progress-text">Вопрос 0 из 0</span>
                <div class="progress-bar"><div id="progress-fill" class="progress-fill"></div></div>
            </div>
        </header>

        <!-- Экран выбора упражнения -->
        <section id="start-screen" class="screen">
            <h2>Выберите упражнение</h2>
            <div id="exercise-list" class="exercise-list">
                <p class="placeholder">Загрузка списка упражнений…</p>
            </div>
        </section>

        <!-- Экран single: один вопрос на экране (варианты 1, 2, 5) -->
        <section id="single-screen" class="screen hidden">
            <div class="trainer-container">
                <div class="column">
                    <h3>1. Картинка</h3>
                    <div id="single-col1" class="result-box">
                        <span class="placeholder">—</span>
                    </div>
                </div>
                <div class="column">
                    <h3>2. Число</h3>
                    <div id="single-col2" class="result-box">
                        <span class="placeholder">—</span>
                    </div>
                </div>
                <div class="column">
                    <h3>3. Слово</h3>
                    <div id="single-col3" class="result-box">
                        <span class="placeholder">—</span>
                    </div>
                </div>
            </div>
            <div class="single-input-row">
                <input id="single-input" type="text" placeholder="Введите ответ"
                       autocomplete="off" autocapitalize="characters">
                <button id="single-submit" class="btn btn-primary">Проверить</button>
            </div>
            <div id="single-attempts" class="attempts-info"></div>
        </section>

        <!-- Экран grid: все вопросы одной таблицей (варианты 3, 4, 6) -->
        <section id="grid-screen" class="screen hidden">
            <div class="grid-header-row">
                <div>1. Картинка</div>
                <div>2. Число</div>
                <div>3. Слово</div>
            </div>
            <div id="grid-rows" class="grid-rows"></div>
            <div class="grid-actions">
                <button id="grid-submit" class="btn btn-primary">Завершить и проверить</button>
            </div>
        </section>

        <!-- Экран результатов -->
        <section id="results-screen" class="screen hidden">
            <h2 id="results-title">Результаты тренировки</h2>
            <div class="results-summary">
                <div class="stat-card">
                    <div class="stat-value" id="correct-count">0</div>
                    <div class="stat-label">Верных ответов</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" id="total-count">0</div>
                    <div class="stat-label">Всего вопросов</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" id="percentage">0%</div>
                    <div class="stat-label">Процент верных</div>
                </div>
            </div>
            <div class="results-actions">
                <button class="btn btn-primary" onclick="App.repeatExercise()">Повторить</button>
                <button class="btn btn-secondary" onclick="App.goToStart()">К выбору упражнения</button>
            </div>
        </section>
    </div>

    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
    <script src="{{ url_for('static', filename='js/single.js') }}"></script>
    <script src="{{ url_for('static', filename='js/grid.js') }}"></script>
    <script>App.init();</script>
</body>
</html>
