<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Админ-панель — Тренажёр памяти</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <header>
            <h1>Админ-панель</h1>
            <nav>
                <a href="/" class="btn btn-secondary">К тренажёру</a>
                <a href="/reference" class="btn btn-secondary">Справочник</a>
            </nav>
        </header>

        <div class="admin-content">
            <section class="admin-section">
                <h2>Статистика по упражнениям</h2>
                <div id="stats-container" class="stats-grid">
                    <p class="placeholder">Загрузка…</p>
                </div>
            </section>

            <section class="admin-section">
                <div class="admin-section-header">
                    <h2>История тренировок</h2>
                    <div>
                        <label for="filter-exercise">Фильтр:</label>
                        <select id="filter-exercise"><option value="">Все упражнения</option></select>
                        <button class="btn btn-secondary" id="clear-results-btn">Очистить историю</button>
                    </div>
                </div>
                <div id="results-list" class="results-list">
                    <p class="placeholder">Загрузка…</p>
                </div>
            </section>

            <section class="admin-section">
                <h2>Справочник изображений ({{ '' }}<span id="images-count">…</span>)</h2>
                <div id="images-list" class="images-grid">
                    <p class="placeholder">Загрузка…</p>
                </div>
            </section>
        </div>
    </div>

    <script src="{{ url_for('static', filename='admin.js') }}"></script>
</body>
</html>
